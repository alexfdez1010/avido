name: Build & release APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'modules/**'
      - 'plugins/**'
      - 'patches/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.node-version'
      - '.nvmrc'
      - 'app.config.*'
      - 'app.json'
      - 'babel.config.*'
      - 'metro.config.*'
      - 'react-native.config.*'
      - 'tailwind.config.*'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - '*-env.d.ts'
      - 'uniwind-types.d.ts'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
      NODE_OPTIONS: --max-old-space-size=6144
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # React Native's application CMake project detects ccache automatically.
      # Cache compiler outputs, never generated native projects or signing keys.
      - name: Install native compiler cache
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ccache
          fi

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('package-lock.json') }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & lint
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "AVIDO_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; signing with a throwaway debug key"
          fi

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        env:
          AVIDO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AVIDO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AVIDO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Report compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats
            {
              echo '### Native compiler cache'
              echo '```text'
              ccache --show-stats
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/avido-${APP_VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk dist/avido.apk
          ls -la dist

      - name: Save workflow artifact
        uses: actions/upload-artifact@v4
        # The APK is also attached to the release; artifact quota must not block it.
        continue-on-error: true
        with:
          name: avido-${{ env.APP_VERSION }}
          path: dist/avido-${{ env.APP_VERSION }}.apk
          retention-days: 3
          compression-level: 0

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Ávido ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Ávido APK built automatically from `${{ github.sha }}`.

            Download `avido.apk` and install it on Android (allow "install unknown apps").
            The versioned `avido-${{ env.APP_VERSION }}.apk` is the same build.
